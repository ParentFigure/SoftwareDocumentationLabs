{% extends 'base.html' %}
{% block title %}Видалити рахунок{% endblock %}
{% block content %}
<div class="card">
    <h2>Підтвердження видалення</h2>
    <p>Ви дійсно хочете видалити рахунок <strong>{{ account.iban }}</strong> клієнта <strong>{{ account.full_name }}</strong>?</p>
    <p class="muted">Разом з рахунком будуть видалені пов'язані картки та транзакції.</p>
    <form method="post">
        <button class="btn btn-danger" type="submit">Так, видалити</button>
        <a class="btn btn-secondary" href="{{ url_for('accounts.details', account_id=account.account_id) }}">Скасувати</a>
    </form>
</div>
{% endblock %}

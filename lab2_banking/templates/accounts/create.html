{% extends 'base.html' %}
{% block title %}Додати рахунок{% endblock %}
{% block content %}
<div class="card">
    <h2>Додавання нового рахунку</h2>
    <form method="post">
        <label for="customer_no">Клієнт</label>
        <select name="customer_no" id="customer_no" required>
            <option value="">Оберіть клієнта</option>
            {% for customer in customers %}
            <option value="{{ customer.customer_no }}" {% if form.customer_no == customer.customer_no %}selected{% endif %}>
                {{ customer.full_name }} ({{ customer.customer_no }})
            </option>
            {% endfor %}
        </select>

        <label for="iban">IBAN</label>
        <input type="text" name="iban" id="iban" value="{{ form.iban }}" required>

        <label for="currency">Валюта</label>
        <input type="text" name="currency" id="currency" value="{{ form.currency }}" required>

        <label for="balance">Баланс</label>
        <input type="number" step="0.01" name="balance" id="balance" value="{{ form.balance }}" required>

        <button class="btn btn-primary" type="submit">Зберегти</button>
        <a class="btn btn-secondary" href="{{ url_for('accounts.index') }}">Скасувати</a>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Редагувати рахунок{% endblock %}
{% block content %}
<div class="card">
    <h2>Редагування рахунку</h2>
    <p><strong>Клієнт:</strong> {{ account.full_name }} ({{ account.customer_no }})</p>
    <form method="post">
        <label for="iban">IBAN</label>
        <input type="text" name="iban" id="iban" value="{{ account.iban }}" required>

        <label for="currency">Валюта</label>
        <input type="text" name="currency" id="currency" value="{{ account.currency }}" required>

        <label for="balance">Баланс</label>
        <input type="number" step="0.01" name="balance" id="balance" value="{{ account.balance }}" required>

        <button class="btn btn-warning" type="submit">Оновити</button>
        <a class="btn btn-secondary" href="{{ url_for('accounts.details', account_id=account.account_id) }}">Назад</a>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Редагувати транзакцію{% endblock %}
{% block content %}
<div class="card"><h2>Редагування транзакції</h2><form method="post">
<label>Рахунок</label><select name="account_id" required><option value="">Оберіть рахунок</option>{% for account in accounts %}<option value="{{ account.account_id }}" {% if tx.account_id == account.account_id %}selected{% endif %}>{{ account.full_name }} — {{ account.iban }}</option>{% endfor %}</select>
<label>Тип</label><select name="tx_type">{% for tx_type in tx_types %}<option value="{{ tx_type }}" {% if tx.tx_type == tx_type %}selected{% endif %}>{{ tx_type }}</option>{% endfor %}</select>
<label>Сума</label><input type="number" step="0.01" name="amount" value="{{ tx.amount }}" required>
<label>Статус</label><select name="status">{% for status in statuses %}<option value="{{ status }}" {% if tx.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select>
<label>Дата і час</label><input type="datetime-local" name="created_at" value="{{ tx.created_at_input }}">
<label>IBAN отримувача (для TRANSFER)</label><input type="text" name="target_iban" value="{{ tx.target_iban or '' }}">
<label>Bill ID (для BILL_PAYMENT)</label><input type="text" name="bill_id" value="{{ tx.bill_id or '' }}">
<button class="btn btn-warning" type="submit">Оновити</button> <a class="btn btn-secondary" href="{{ url_for('transactions.details', tx_id=tx.tx_id) }}">Назад</a>
</form></div>
{% endblock %}
